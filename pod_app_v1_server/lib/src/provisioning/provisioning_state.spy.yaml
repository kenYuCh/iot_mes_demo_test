### 設備配對狀態機（docs/product/ESP32_Server_mTLS_Provisioning_完整設計手冊.md §12）。
### 開發環境省略 Wi-Fi 配網階段（需實體 ESP32 + BLE）。
enum: ProvisioningState
serialized: byName
values:
  ### 出廠已登錄，尚未被任何帳號綁定。
  - unclaimed
  ### 使用者掃碼後建立 Claim Session，等待設備回應。
  - claimPending
  ### 設備通過 Bootstrap 驗證並完成綁定。
  - claimed
  ### 正式 MQTT 憑證已簽發。
  - certificateIssued
  ### 設備啟用，可用正式憑證連線。
  - active
  ### 憑證已撤銷 / 設備停用。
  - revoked
